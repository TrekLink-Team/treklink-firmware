; TrekLink screen capture (tools/screencap/README.md). A native (Linux) build of the TrekLink firmware
; that draws the real device UI into a 128x64 in-memory display and saves screens on request, so the guide's
; screenshots need no device. Not a device image: never flash it.
;
; The pins are simulated GPIOs on the host (src/platform/portduino/TrekLinkScreenCap.cpp); their numbers only
; have to satisfy TrekLinkVariantValidation.h (which skips its I2C check here) and stay below the 64 simulated pins portduino creates.

[treklink_screencap_base]
extends = native_base
build_flags = ${native_base.build_flags}
  !pkg-config --libs libulfius --silence-errors || :
  !pkg-config --libs openssl --silence-errors || :
  -D TREKLINK_VARIANT
  -D TREKLINK_SCREENCAP=1
  -D BUTTON_PIN=1
  -D GPS_RX_PIN=11 ; every TrekLink unit has a GPS; the capture script can feed it NMEA (--gps)
  -D GPS_TX_PIN=12
; No motion sensor on the host: the capture build runs without fall detection (src/modules/Modules.cpp).
build_src_filter = ${native_base.build_src_filter}
  -<modules/sensors/>

[env:treklink-screencap-v2]
extends = treklink_screencap_base
; The v2 board code drives the power latch and GPS pins of the real PCB; the host has neither.
build_src_filter = ${treklink_screencap_base.build_src_filter}
  -<platform/extra_variants/treklink_v2/>
build_flags = ${treklink_screencap_base.build_flags}
  -D TREKLINK_V2
  -D BUTTON_PIN_UP=2
  -D BUTTON_PIN_DOWN=3
  -D BUTTON_PIN_SOS=4

[env:treklink-screencap-v3]
extends = treklink_screencap_base
build_flags = ${treklink_screencap_base.build_flags}
  -D TREKLINK_V3

[env:treklink-screencap-v4]
extends = treklink_screencap_base
build_flags = ${treklink_screencap_base.build_flags}
  -D TREKLINK_V4
