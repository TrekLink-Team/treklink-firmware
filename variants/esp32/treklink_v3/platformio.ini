; TrekLink v3, LilyGo T-Beam v1.2. Parts: specs/variants/v3/components.md. Overlay: specs/architecture.
[env:treklink-v3]
extends = env:tbeam

build_src_filter =
  ${esp32_base.build_src_filter}
  +<../treklink/src/>
  +<../variants/esp32/treklink_v3>

; The MQTT override wraps a stock symbol, which LTO can resolve before the wrap applies (design §4.1).
build_unflags =
  ${esp32_common.build_unflags}
  -flto

build_flags =
  -I variants/esp32/treklink_v3                 # before the stock dir, so configuration.h finds this variant.h
  ${env:tbeam.build_flags}
  -I treklink/src
  -D TREKLINK_VARIANT
  -D TREKLINK_ONBOARD_QUEUE=1               # specs/onboard-queue, TrekLinkQueueConfig.h defaults
  -Wl,--wrap=_ZN4MQTT6onSendERK22_meshtastic_MeshPacketS2_h
  -Wl,--wrap=_ZN12ButtonThread10initButtonERK12ButtonConfig  # specs/sos REQ-SOS-TRG-01.4
