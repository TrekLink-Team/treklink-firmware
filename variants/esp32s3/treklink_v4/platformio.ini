; TrekLink v4, LilyGo T-Beam Supreme. Parts: specs/variants/v4/components.md. Overlay: specs/architecture.
[env:treklink-v4]
extends = env:tbeam-s3-core

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../treklink/src/>
  +<../variants/esp32s3/treklink_v4>

; The MQTT override wraps a stock symbol, which LTO can resolve before the wrap applies (design §4.1).
build_unflags =
  ${esp32_common.build_unflags}
  -flto

build_flags =
  -I variants/esp32s3/treklink_v4                 # before the stock dir, so configuration.h finds this variant.h
  ${env:tbeam-s3-core.build_flags}
  -I treklink/src
  -D TREKLINK_VARIANT
  -D TREKLINK_ONBOARD_QUEUE=1               # specs/onboard-queue, durable priority MQTT queue
  -D TREKLINK_OQ_MAX_ENTRIES=1000           # onboard-queue design.md section 4, 1.5 MiB LittleFS
  -D TREKLINK_OQ_RAM_ENTRIES=64
  -D TREKLINK_OQ_FLASH_BUDGET_BYTES=524288
  -Wl,--wrap=_ZN4MQTT6onSendERK22_meshtastic_MeshPacketS2_h
  -Wl,--wrap=_ZN12ButtonThread10initButtonERK12ButtonConfig  # specs/sos REQ-SOS-TRG-01.4
