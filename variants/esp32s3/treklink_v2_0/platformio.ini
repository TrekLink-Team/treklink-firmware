[env:treklink-v2]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_check = true

lib_deps =
  ${esp32s3_base.lib_deps}
  ${radiolib_base.lib_deps}
  ${environmental_base.lib_deps}

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/treklink_v2_0>

build_unflags =
  -flto
  # Meshtastic 2.7.26 needs C++17; this override replaces the inherited std unflags.
  -std=c++11
  -std=gnu++11

build_flags =
  ${esp32s3_base.build_flags}
  -D TREKLINK_VARIANT
  -D TREKLINK_V2
  -D TREKLINK_ONBOARD_QUEUE=1               # specs/onboard-queue, durable priority MQTT queue
  -D TREKLINK_OQ_MAX_ENTRIES=1000           # design.md section 4, 1.5 MiB LittleFS
  -D TREKLINK_OQ_RAM_ENTRIES=64
  -D TREKLINK_OQ_FLASH_BUDGET_BYTES=524288
  -D HAS_SCREEN=1
  -I variants/esp32s3/treklink_v2_0

