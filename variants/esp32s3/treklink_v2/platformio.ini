; TrekLink v2 custom board. Parts: specs/variants/v2/components.md. Overlay: specs/architecture.
[env:treklink-v2]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_check = true

lib_deps =
  ${esp32s3_base.lib_deps}
  ${radiolib_base.lib_deps}
  ${environmental_base.lib_deps}

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../treklink/src/>
  +<../variants/esp32s3/treklink_v2>

; The MQTT override wraps a stock symbol, which LTO can resolve before the wrap applies (design §4.1).
build_unflags =
  ${esp32_common.build_unflags}
  -flto

build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/treklink_v2
  -I treklink/src
  -D TREKLINK_VARIANT
  -D HAS_SCREEN=1
  -D TREKLINK_ONBOARD_QUEUE=1               # specs/onboard-queue, durable priority MQTT queue
  -D TREKLINK_OQ_MAX_ENTRIES=1000           # onboard-queue design.md section 4, 1.5 MiB LittleFS
  -D TREKLINK_OQ_RAM_ENTRIES=64
  -D TREKLINK_OQ_FLASH_BUDGET_BYTES=524288
  -Wl,--wrap=_ZN4MQTT6onSendERK22_meshtastic_MeshPacketS2_h
