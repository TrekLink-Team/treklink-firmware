# cargo-about configuration for THIRD-PARTY-NOTICES.txt, generated in CI and shipped in every
# tk-flasher archive. Regenerate locally with:
#   cargo about generate --locked about.hbs -o THIRD-PARTY-NOTICES.txt
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
targets = [
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
