[package]
name = "tk-flasher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Keyboard-only terminal tool to install, update, verify and erase TrekLink firmware"
license = "GPL-3.0-only"
repository = "https://github.com/TrekLink-Team/treklink-firmware"
publish = false

[dependencies]
crossterm = "0.29"
espflash = { version = "4.7.0", default-features = false, features = [
  "serialport",
] }
hex = "0.4.3"
md-5 = "0.11.0"
meshtastic = "0.1.9"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# No libudev: on Linux the ports are listed from sysfs, so the binary has no system library
# dependency and also builds for musl.
serialport = { version = "4.10", default-features = false }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "time"] }
tokio-serial = { version = "5.5", default-features = false }
ureq = { version = "3.5", features = ["platform-verifier"] }

[profile.release]
lto = "thin"
strip = true
