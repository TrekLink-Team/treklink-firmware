name: TrekLink Firmware Release

on:
  push:
    tags:
      - "v*-treklink.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing TrekLink release tag, for example v2.7.26-treklink.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Validate tag
        id: release-tag
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9A-Za-z._-]+-treklink\.[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid TrekLink release tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.pio_env }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: treklink-v2
          - pio_env: treklink-v3-tbeam
          - pio_env: treklink-v4-supreme
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Restore PlatformIO cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            .pio/libdeps
          key: treklink-pio-${{ runner.os }}-${{ matrix.pio_env }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini', 'bin/build-esp32.sh') }}
          restore-keys: |
            treklink-pio-${{ runner.os }}-${{ matrix.pio_env }}-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        env:
          PIO_ENV: ${{ matrix.pio_env }}
          PLATFORMIO_SETTING_ENABLE_TELEMETRY: "0"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          bash bin/build-esp32.sh "$PIO_ENV"

      - name: Collect release images
        env:
          PIO_ENV: ${{ matrix.pio_env }}
        shell: bash
        run: |
          set -euo pipefail
          build_version="$(python3 bin/buildinfo.py long)"
          source_prefix="release/firmware-${PIO_ENV}-${build_version}"
          mkdir -p release-assets
          install -m 0644 "${source_prefix}.bin" "release-assets/firmware-${PIO_ENV}.bin"
          install -m 0644 "${source_prefix}.factory.bin" "release-assets/firmware-${PIO_ENV}.factory.bin"

      - name: Upload release images
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: treklink-release-${{ matrix.pio_env }}
          path: release-assets/*.bin
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish TrekLink release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Download release images
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: treklink-release-*
          merge-multiple: true
          path: release-assets

      - name: Generate TrekLink manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 bin/treklink_manifest.py \
            --version "$RELEASE_TAG" \
            --input-dir release-assets \
            --output release-assets/treklink-manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: TrekLink firmware ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/firmware-treklink-v2.bin
            release-assets/firmware-treklink-v2.factory.bin
            release-assets/firmware-treklink-v3-tbeam.bin
            release-assets/firmware-treklink-v3-tbeam.factory.bin
            release-assets/firmware-treklink-v4-supreme.bin
            release-assets/firmware-treklink-v4-supreme.factory.bin
            release-assets/treklink-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
