version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - checkov@3.2.497
    - renovate@42.84.2
    - prettier@3.8.0
    - trufflehog@3.92.5
    - yamllint@1.38.0
    - bandit@1.9.3
    - trivy@0.69.2 # 0.68.2 was pinned but never published; its release URL 404s
    - taplo@0.10.0
    - ruff@0.14.13
    - isort@7.0.0
    - markdownlint@0.47.0
    - oxipng@10.0.0
    - svgo@4.0.0
    - actionlint@1.7.10
    - flake8@7.3.0
    - hadolint@2.14.0
    - shfmt@3.6.0
    - shellcheck@0.11.0
    - black@26.1.0
    - git-diff-check
    - gitleaks@8.30.0
    - clang-format@16.0.3
  ignore:
    - linters: [ALL]
      paths:
        - bin/**
    # AGENTS.md and CLAUDE.md are canonical TrekLink files, byte-identical across four
    # repositories by design (decision D-011). A per-repo formatter must not own them: the
    # moment prettier reformats the copy in one repo, the four-way identity breaks, and it
    # breaks again on every future formatter version bump. They are maintained in
    # treklink-docs and copied verbatim.
    - linters: [prettier, markdownlint]
      paths:
        - AGENTS.md
        - CLAUDE.md
    # TrekLink module specs follow the project's own documentation conventions, held in
    # treklink-docs (_docs/01-conventions/02-spec-driven-development-workflow.md and
    # 14-prose-and-wording.md): prose wrapped at 100 columns, wide comparison tables, and
    # EARS requirement lines that are single sentences by design. This repository's trunk
    # config is inherited upstream tooling, and its markdownlint default of MD013 at 80
    # columns would fail every one of those lines while prettier would reflow the tables.
    # Same reasoning as the two files above: a per-repo formatter must not own a document
    # whose format is defined somewhere else.
    - linters: [prettier, markdownlint]
      paths:
        - specs/**
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@22.16.0
actions:
  disabled:
    - trunk-announce
  enabled:
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
